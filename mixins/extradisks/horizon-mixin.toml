[mod]
id = "extradisks"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure storage model (the rung ladder, a container's capacity, the resource
# identity, insert/extract and the saved encoding), injected as
# `crate::game::extradisks`.
#
# The content half is inside this bundle (`data/extradisks-content.hmod`, the built
# `content/extradisks.hmod`): this writes it to `.horizon-cache/` and appends it to
# the dev-mod list, so one `.hnmod` installs the content and the code. The registry
# keeps one file per project, so a split port could not be listed; AE2 ships the
# same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "extradisks"
source = "runtime.rs"

# Game-side glue: the block entity's saved storage, the right-click and the
# commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "extradisks_state"
source = "support.rs"

# Before content loads: register the item component that carries a disk's
# contents.
[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "types" },
]

# The 1024k storage block declares a block entity.
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# A held stack onto the block goes in; an empty hand takes a stack out.
[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# `/extradisks info|insert|extract` and `/extradisks disk …`.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
